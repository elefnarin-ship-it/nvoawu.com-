<?xml version="1.0" encoding="UTF-8"?>
<!--
  N VoaWu — icon sprite.
  All icons share a 24×24 viewBox, are stroke-based (1.6 weight), rounded
  caps/joins, and use currentColor for fill/stroke so they inherit text color.
  Reference: <svg class="icon"><use href="/images/icons.svg#icon-arrow-right"/></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg"
     style="display:none"
     aria-hidden="true"
     fill="none"
     stroke="currentColor"
     stroke-width="1.6"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>

    <!-- icon-arrow-right -->
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <line x1="4" y1="12" x2="20" y2="12"/>
      <polyline points="14,6 20,12 14,18"/>
    </symbol>

    <!-- icon-arrow-up-right -->
    <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
      <line x1="6" y1="18" x2="18" y2="6"/>
      <polyline points="9,6 18,6 18,15"/>
    </symbol>

    <!-- icon-menu -->
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <line x1="4" y1="7"  x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </symbol>

    <!-- icon-close -->
    <symbol id="icon-close" viewBox="0 0 24 24">
      <line x1="6" y1="6"  x2="18" y2="18"/>
      <line x1="18" y1="6" x2="6"  y2="18"/>
    </symbol>

    <!-- icon-spark (4-point star) -->
    <symbol id="icon-spark" viewBox="0 0 24 24">
      <path d="M12 2 L13.6 9.2 L21 12 L13.6 14.8 L12 22 L10.4 14.8 L3 12 L10.4 9.2 Z"/>
    </symbol>

    <!-- icon-shield -->
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 3 L20 6 V12 C20 17 16.5 20 12 21.5 C7.5 20 4 17 4 12 V6 Z"/>
      <polyline points="9,12 11.5,14.5 15.5,10.5"/>
    </symbol>

    <!-- icon-globe -->
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12 H21"/>
      <path d="M12 3 C15 6.5 15 17.5 12 21 C9 17.5 9 6.5 12 3"/>
    </symbol>

    <!-- icon-rocket -->
    <symbol id="icon-rocket" viewBox="0 0 24 24">
      <path d="M14 4 C18 4 20 7 20 11 C20 14 18 16 16 17 L8 17 C6 16 4 14 4 11 C4 7 6 4 10 4 Z"/>
      <circle cx="12" cy="10" r="1.8"/>
      <path d="M8 17 L6 21 L9 19"/>
      <path d="M16 17 L18 21 L15 19"/>
    </symbol>

    <!-- icon-bolt -->
    <symbol id="icon-bolt" viewBox="0 0 24 24">
      <polygon points="13,2 5,13 11,13 9,22 19,10 13,10"/>
    </symbol>

    <!-- icon-gamepad -->
    <symbol id="icon-gamepad" viewBox="0 0 24 24">
      <path d="M6 8 H18 A4 4 0 0 1 22 12 V14 A4 4 0 0 1 18 18 H17 L15 15 H9 L7 18 H6 A4 4 0 0 1 2 14 V12 A4 4 0 0 1 6 8 Z"/>
      <line x1="7" y1="12" x2="7.01" y2="12"/>
      <line x1="6" y1="11" x2="6.01" y2="11"/>
      <line x1="6" y1="13" x2="6.01" y2="13"/>
      <line x1="8" y1="12" x2="8.01" y2="12"/>
      <circle cx="15.5" cy="11.5" r="0.8"/>
      <circle cx="17"   cy="13"   r="0.8"/>
    </symbol>

    <!-- icon-mobile -->
    <symbol id="icon-mobile" viewBox="0 0 24 24">
      <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
      <line x1="9" y1="18.5" x2="15" y2="18.5"/>
    </symbol>

    <!-- icon-megaphone -->
    <symbol id="icon-megaphone" viewBox="0 0 24 24">
      <path d="M3 10 V14 A1 1 0 0 0 4 15 H6 L13 19 V5 L6 9 H4 A1 1 0 0 0 3 10 Z"/>
      <path d="M16 9 C18 10 18 14 16 15"/>
      <path d="M9 15 V19 A1.5 1.5 0 0 0 12 19 V16"/>
    </symbol>

    <!-- icon-palette -->
    <symbol id="icon-palette" viewBox="0 0 24 24">
      <path d="M12 3 A9 9 0 1 0 12 21 A2 2 0 0 0 14 19 V18 A2 2 0 0 1 16 16 H18 A4 4 0 0 0 22 12 C22 7 17.5 3 12 3 Z"/>
      <circle cx="7.5"  cy="11" r="1"/>
      <circle cx="11"   cy="7"  r="1"/>
      <circle cx="16"   cy="8.5" r="1"/>
    </symbol>

    <!-- icon-cube -->
    <symbol id="icon-cube" viewBox="0 0 24 24">
      <path d="M12 3 L21 7.5 V16.5 L12 21 L3 16.5 V7.5 Z"/>
      <polyline points="3,7.5 12,12 21,7.5"/>
      <line x1="12" y1="12" x2="12" y2="21"/>
    </symbol>

    <!-- icon-cloud -->
    <symbol id="icon-cloud" viewBox="0 0 24 24">
      <path d="M7 18 A5 5 0 0 1 7 8.5 A6 6 0 0 1 18.5 9 A4 4 0 0 1 17 18 Z"/>
    </symbol>

    <!-- icon-lock -->
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
      <path d="M8 10.5 V7 A4 4 0 0 1 16 7 V10.5"/>
      <circle cx="12" cy="15.5" r="1.2"/>
    </symbol>

    <!-- icon-mail -->
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <polyline points="3,7 12,13 21,7"/>
    </symbol>

    <!-- icon-pin -->
    <symbol id="icon-pin" viewBox="0 0 24 24">
      <path d="M12 22 C12 22 19 14 19 9.5 A7 7 0 1 0 5 9.5 C5 14 12 22 12 22 Z"/>
      <circle cx="12" cy="9.5" r="2.5"/>
    </symbol>

    <!-- icon-clock -->
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <polyline points="12,7 12,12 16,14"/>
    </symbol>

    <!-- icon-check -->
    <symbol id="icon-check" viewBox="0 0 24 24">
      <polyline points="4,12 10,18 20,6"/>
    </symbol>

  </defs>
</svg>
