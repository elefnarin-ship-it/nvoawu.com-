    <!-- Android-style badge -->
    <g>
      <rect width="180" height="54" rx="12" fill="#0A0D14"/>
      <g transform="translate(14 12)">
        <path d="M0 12 L12 0 L14 2 L2 14 Z" fill="#6BE3B7"/>
        <path d="M14 2 L26 14 L24 16 L12 4 Z" fill="#7EC8FF"/>
        <path d="M0 12 L2 14 L14 26 L12 28 L0 16 Z" fill="#FFD86B"/>
        <path d="M14 2 L26 14 L28 12 L16 0 Z" fill="#FF8A6B"/>
      </g>
      <text x="60" y="22" font-family="Inter, system-ui, sans-serif"
            font-size="9" font-weight="500" fill="#A6ADBE" letter-spacing="0.5">GET IT ON</text>
      <text x="60" y="42" font-family="Inter, system-ui, sans-serif"
            font-size="16" font-weight="700" fill="#FFFFFF">Android Store</text>
    </g>
    <!-- iOS-style badge -->
    <g transform="translate(0 70)">
      <rect width="180" height="54" rx="12" fill="#0A0D14"/>
      <g transform="translate(14 14)">
        <path d="M14 2 C12 4 8 4 6 2 C4 4 4 8 6 10 C8 12 12 12 14 10 C16 12 20 12 22 10 C24 8 24 4 22 2 C20 4 16 4 14 2 Z"
