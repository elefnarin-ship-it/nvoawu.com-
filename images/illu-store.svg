      <g>
        <rect width="100" height="120" rx="14" fill="#FFFFFF" opacity="0.08"/>
        <rect x="14" y="14" width="40" height="40" rx="10" fill="#7EC8FF"/>
        <text x="34" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="18" font-weight="700" fill="#0A0D14">T</text>
        <text x="14" y="74" font-family="Inter, system-ui, sans-serif"
              font-size="10" font-weight="600" fill="#FFFFFF">ToolBox Pro</text>
        <text x="14" y="86" font-family="Inter, system-ui, sans-serif"
              font-size="8" fill="#FFFFFF" opacity="0.55">Utilities</text>
        <text x="14" y="104" font-family="Inter, system-ui, sans-serif"
              font-size="8" font-weight="600" fill="#6BE3B7">4.5 ★</text>
      </g>
      <g transform="translate(120 0)">
        <rect width="100" height="120" rx="14" fill="#FFFFFF" opacity="0.08"/>
        <rect x="14" y="14" width="40" height="40" rx="10" fill="#FFD86B"/>
        <text x="34" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="18" font-weight="700" fill="#0A0D14">C</text>
        <text x="14" y="74" font-family="Inter, system-ui, sans-serif"
              font-size="10" font-weight="600" fill="#FFFFFF">CamCue</text>
        <text x="14" y="86" font-family="Inter, system-ui, sans-serif"
              font-size="8" fill="#FFFFFF" opacity="0.55">Photo · Video</text>
        <text x="14" y="104" font-family="Inter, system-ui, sans-serif"
              font-size="8" font-weight="600" fill="#6BE3B7">4.7 ★</text>
      </g>
    </g>
    <g transform="translate(20 360)">
      <g>
        <rect width="100" height="40" rx="12" fill="#FFFFFF" opacity="0.08"/>
        <rect x="10" y="10" width="20" height="20" rx="5" fill="#6BE3B7"/>
        <text x="38" y="18" font-family="Inter, system-ui, sans-serif"
              font-size="9" font-weight="600" fill="#FFFFFF">FitTrack</text>
        <text x="38" y="30" font-family="Inter, system-ui, sans-serif"
              font-size="8" fill="#FFFFFF" opacity="0.55">Health</text>
