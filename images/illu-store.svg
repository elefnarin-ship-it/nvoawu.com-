        <path d="M14 14 C12 14 8 18 8 24 C8 30 12 34 14 34 C16 34 18 32 20 32 C22 32 24 34 26 34 C28 34 32 30 32 24 C32 18 28 14 26 14 C24 14 22 16 20 16 C18 16 16 14 14 14 Z"
              fill="#FFFFFF"/>
      </g>
      <text x="60" y="22" font-family="Inter, system-ui, sans-serif"
            font-size="9" font-weight="500" fill="#A6ADBE" letter-spacing="0.5">DOWNLOAD ON</text>
      <text x="60" y="42" font-family="Inter, system-ui, sans-serif"
            font-size="16" font-weight="700" fill="#FFFFFF">iOS Store</text>
    </g>
