        <text x="14" y="32" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFD86B">1</text>
        <rect x="32" y="8" width="32" height="32" rx="8" fill="#2A52FF"/>
        <text x="48" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFFFFF">P</text>
        <text x="74" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">Puzzle Pop</text>
