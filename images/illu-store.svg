        <rect x="32" y="8" width="32" height="32" rx="8" fill="#7EC8FF"/>
        <text x="48" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFFFFF">T</text>
        <text x="74" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">ToolBox Pro</text>
        <text x="74" y="36" font-family="Inter, system-ui, sans-serif"
              font-size="9" fill="#FFFFFF" opacity="0.6">Utilities · 4.5★</text>
      </g>
      <g transform="translate(0 112)">
        <rect width="220" height="48" rx="12" fill="#FFFFFF" opacity="0.06"/>
        <text x="14" y="32" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#A6ADBE">3</text>
        <rect x="32" y="8" width="32" height="32" rx="8" fill="#FF8A6B"/>
        <text x="48" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFFFFF">C</text>
        <text x="74" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">CamCue</text>
        <text x="74" y="36" font-family="Inter, system-ui, sans-serif"
              font-size="9" fill="#FFFFFF" opacity="0.6">Photo · 4.7★</text>
      </g>
      <g transform="translate(0 168)">
        <rect width="220" height="48" rx="12" fill="#FFFFFF" opacity="0.06"/>
        <text x="14" y="32" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#A6ADBE">4</text>
        <rect x="32" y="8" width="32" height="32" rx="8" fill="#6BE3B7"/>
        <text x="48" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFFFFF">F</text>
        <text x="74" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">FitTrack</text>
        <text x="74" y="36" font-family="Inter, system-ui, sans-serif"
              font-size="9" fill="#FFFFFF" opacity="0.6">Health · 4.6★</text>
      </g>
      <g transform="translate(0 224)">
        <rect width="220" height="48" rx="12" fill="#FFFFFF" opacity="0.06"/>
        <text x="14" y="32" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#A6ADBE">5</text>
        <rect x="32" y="8" width="32" height="32" rx="8" fill="#C5A8FF"/>
        <text x="48" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFFFFF">N</text>
        <text x="74" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">NoteNimbus</text>
        <text x="74" y="36" font-family="Inter, system-ui, sans-serif"
              font-size="9" fill="#FFFFFF" opacity="0.6">Productivity · 4.8★</text>
      </g>
    </g>
