      <g transform="translate(120 0)">
        <rect width="100" height="40" rx="12" fill="#FFFFFF" opacity="0.08"/>
        <rect x="10" y="10" width="20" height="20" rx="5" fill="#C5A8FF"/>
        <text x="38" y="18" font-family="Inter, system-ui, sans-serif"
