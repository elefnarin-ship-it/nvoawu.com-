<?xml version="1.0" encoding="UTF-8"?>
<!-- "Apps on Play & App Store" — store display grid + bear mascot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Apps on Google Play and the iOS Store">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7FB"/>
      <stop offset="1" stop-color="#ECEFF5"/>
    </linearGradient>
    <linearGradient id="st-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151F"/>
      <stop offset="1" stop-color="#1A1F2C"/>
    </linearGradient>
    <linearGradient id="st-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A52FF"/>
      <stop offset="1" stop-color="#C5A8FF"/>
    </linearGradient>
    <symbol id="st-bear" viewBox="0 0 200 200">
      <circle cx="56" cy="62" r="18" fill="#A37A4A"/>
      <circle cx="144" cy="62" r="18" fill="#A37A4A"/>
      <circle cx="56" cy="64" r="9" fill="#E0B98A"/>
      <circle cx="144" cy="64" r="9" fill="#E0B98A"/>
      <circle cx="100" cy="108" r="66" fill="#B58858"/>
      <ellipse cx="100" cy="128" rx="34" ry="24" fill="#E0B98A"/>
      <circle cx="80" cy="98" r="6" fill="#1A1F2C"/>
      <circle cx="120" cy="98" r="6" fill="#1A1F2C"/>
      <circle cx="82" cy="95" r="1.8" fill="#FFFFFF"/>
      <circle cx="122" cy="95" r="1.8" fill="#FFFFFF"/>
      <ellipse cx="100" cy="122" rx="6" ry="4" fill="#1A1F2C"/>
      <path d="M92 134 Q100 142 108 134" fill="none" stroke="#1A1F2C" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M100 128 L100 134" stroke="#1A1F2C" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#st-bg)"/>

  <!-- Decorative blobs -->
  <circle cx="120" cy="100" r="120" fill="#FFB3D1" opacity="0.25"/>
  <circle cx="700" cy="500" r="140" fill="#C5A8FF" opacity="0.22"/>

  <!-- "Phone" frame (left) -->
  <g transform="translate(60 90)">
    <rect width="260" height="420" rx="34" fill="#0A0D14" stroke="#2A2F3D" stroke-width="2"/>
    <rect x="6" y="6" width="248" height="408" rx="28" fill="url(#st-screen)"/>
    <rect x="92" y="14" width="76" height="14" rx="7" fill="#0A0D14"/>
    <text x="20" y="58" font-family="Inter, system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#FFFFFF">Featured</text>
    <text x="20" y="74" font-family="Inter, system-ui, sans-serif"
          font-size="9" fill="#FFFFFF" opacity="0.6">Curated by N VoaWu</text>

    <!-- Featured big card -->
    <g transform="translate(20 88)">
      <rect width="220" height="120" rx="16" fill="url(#st-accent)"/>
      <circle cx="36" cy="60" r="22" fill="#FFFFFF"/>
      <text x="36" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
