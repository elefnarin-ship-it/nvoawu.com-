  <!-- Bear mascot (top-right) -->
  <g transform="translate(560 30)">
    <use href="#st-bear" x="0" y="0" width="180" height="180"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFD86B">
    <path d="M420 80 L423 86 L429 89 L423 92 L420 98 L417 92 L411 89 L417 86 Z" opacity="0.9"/>
    <path d="M60 530 L63 536 L69 539 L63 542 L60 548 L57 542 L51 539 L57 536 Z" opacity="0.7"/>
  </g>
