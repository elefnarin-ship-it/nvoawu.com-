<?xml version="1.0" encoding="UTF-8"?>
<!-- "Mobile management app" — phone dashboard with a rabbit mascot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Mobile management app">
  <defs>
    <linearGradient id="mbl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7FB"/>
      <stop offset="1" stop-color="#ECEFF5"/>
    </linearGradient>
    <linearGradient id="mbl-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0D14"/>
      <stop offset="1" stop-color="#11151F"/>
    </linearGradient>
    <linearGradient id="mbl-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A52FF"/>
      <stop offset="1" stop-color="#7EC8FF"/>
    </linearGradient>
    <symbol id="mbl-rabbit" viewBox="0 0 200 200">
      <ellipse cx="76" cy="44" rx="14" ry="36" fill="#F6F7FB"/>
      <ellipse cx="124" cy="44" rx="14" ry="36" fill="#F6F7FB"/>
      <ellipse cx="76" cy="48" rx="7" ry="24" fill="#FFB3D1"/>
      <ellipse cx="124" cy="48" rx="7" ry="24" fill="#FFB3D1"/>
      <circle cx="100" cy="118" r="58" fill="#F6F7FB"/>
      <ellipse cx="100" cy="140" rx="42" ry="22" fill="#F0F2F8"/>
      <ellipse cx="82" cy="112" rx="5" ry="7" fill="#1A1F2C"/>
      <ellipse cx="118" cy="112" rx="5" ry="7" fill="#1A1F2C"/>
      <circle cx="83" cy="108" r="1.6" fill="#FFFFFF"/>
      <circle cx="119" cy="108" r="1.6" fill="#FFFFFF"/>
      <path d="M96 130 L104 130 L100 136 Z" fill="#FF8A6B"/>
      <path d="M100 136 Q94 144 90 142" fill="none" stroke="#1A1F2C" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M100 136 Q106 144 110 142" fill="none" stroke="#1A1F2C" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="96" y="140" width="3" height="6" fill="#FFFFFF" stroke="#1A1F2C" stroke-width="1"/>
      <rect x="101" y="140" width="3" height="6" fill="#FFFFFF" stroke="#1A1F2C" stroke-width="1"/>
    </symbol>
  </defs>

  <rect width="800" height="600" rx="32" fill="url(#mbl-bg)"/>

  <!-- Decorative blobs -->
  <circle cx="700" cy="120" r="140" fill="#C5A8FF" opacity="0.18"/>
  <circle cx="100" cy="500" r="120" fill="#7EC8FF" opacity="0.2"/>

  <!-- Soft ring -->
  <circle cx="400" cy="300" r="230" fill="none"
          stroke="#2A52FF" stroke-width="1.6" opacity="0.18" stroke-dasharray="4 6"/>

  <!-- Phone -->
  <g transform="translate(280 60)">
    <rect x="0" y="0" width="240" height="480" rx="36" fill="#0A0D14" stroke="#2A2F3D" stroke-width="2"/>
    <rect x="6" y="6" width="228" height="468" rx="30" fill="url(#mbl-screen)"/>
    <rect x="86" y="14" width="68" height="14" rx="7" fill="#0A0D14"/>

    <!-- Status bar -->
    <text x="22" y="50" font-family="Inter, system-ui, sans-serif"
          font-size="10" font-weight="600" fill="#FFFFFF" opacity="0.85">9:41</text>
    <g transform="translate(196 44)" fill="#FFFFFF" opacity="0.85">
      <rect x="0" y="-4" width="20" height="8" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="2" y="-2" width="14" height="4" rx="1"/>
    </g>

    <!-- Greeting -->
    <text x="22" y="86" font-family="Inter, system-ui, sans-serif"
          font-size="13" fill="#FFFFFF" opacity="0.6">Good morning,</text>
    <text x="22" y="106" font-family="Inter, system-ui, sans-serif"
          font-size="18" font-weight="700" fill="#FFFFFF">Studio Lead</text>

    <!-- Hero card -->
    <g transform="translate(20 124)">
      <rect width="200" height="92" rx="16" fill="url(#mbl-accent)"/>
      <text x="14" y="26" font-family="Inter, system-ui, sans-serif"
            font-size="10" font-weight="500" fill="#FFFFFF" opacity="0.85">REVENUE · TODAY</text>
      <text x="14" y="56" font-family="Inter, system-ui, sans-serif"
            font-size="24" font-weight="700" fill="#FFFFFF">$ 12,480</text>
      <text x="14" y="78" font-family="Inter, system-ui, sans-serif"
            font-size="10" font-weight="500" fill="#FFFFFF" opacity="0.85">▲ 18.4% vs yesterday</text>
      <!-- Mini chart -->
      <polyline points="120,72 134,60 148,66 162,46 176,52 190,32"
                fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" opacity="0.9"/>
    </g>

    <!-- Stat row -->
    <g transform="translate(20 232)">
      <rect width="94" height="78" rx="14" fill="#FFFFFF" opacity="0.08"/>
      <text x="10" y="20" font-family="Inter, system-ui, sans-serif"
            font-size="9" font-weight="500" fill="#FFFFFF" opacity="0.65">DAU</text>
      <text x="10" y="44" font-family="Inter, system-ui, sans-serif"
            font-size="18" font-weight="700" fill="#FFFFFF">38.2k</text>
      <polyline points="10,64 22,58 34,62 46,52 58,56 70,46 84,50"
                fill="none" stroke="#6BE3B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="106" width="94" height="78" rx="14" fill="#FFFFFF" opacity="0.08"/>
      <text x="116" y="20" font-family="Inter, system-ui, sans-serif"
            font-size="9" font-weight="500" fill="#FFFFFF" opacity="0.65">ROAS</text>
      <text x="116" y="44" font-family="Inter, system-ui, sans-serif"
            font-size="18" font-weight="700" fill="#FFFFFF">2.74x</text>
      <polyline points="116,64 128,56 140,60 152,50 164,54 176,44 192,40"
                fill="none" stroke="#FFD86B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- App list -->
    <g transform="translate(20 326)">
      <text x="0" y="0" font-family="Inter, system-ui, sans-serif"
            font-size="11" font-weight="600" fill="#FFFFFF" opacity="0.85">Your apps</text>
      <g transform="translate(0 14)">
        <rect width="200" height="44" rx="12" fill="#FFFFFF" opacity="0.06"/>
        <rect x="8" y="8" width="28" height="28" rx="7" fill="#FF8A6B"/>
        <text x="46" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">Puzzle Pop</text>
        <text x="46" y="36" font-family="Inter, system-ui, sans-serif"
              font-size="9" fill="#FFFFFF" opacity="0.6">Stable · 4.7★ · 1.2M installs</text>
        <text x="190" y="28" text-anchor="end" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="700" fill="#6BE3B7">+8.2%</text>
      </g>
      <g transform="translate(0 66)">
        <rect width="200" height="44" rx="12" fill="#FFFFFF" opacity="0.06"/>
        <rect x="8" y="8" width="28" height="28" rx="7" fill="#7EC8FF"/>
        <text x="46" y="22" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="600" fill="#FFFFFF">ToolBox Pro</text>
        <text x="46" y="36" font-family="Inter, system-ui, sans-serif"
              font-size="9" fill="#FFFFFF" opacity="0.6">Stable · 4.5★ · 860k installs</text>
        <text x="190" y="28" text-anchor="end" font-family="Inter, system-ui, sans-serif"
              font-size="11" font-weight="700" fill="#6BE3B7">+3.6%</text>
      </g>
    </g>

    <!-- Bottom nav -->
    <g transform="translate(20 446)">
      <rect width="200" height="20" rx="10" fill="#FFFFFF" opacity="0.06"/>
      <circle cx="20"  cy="10" r="3" fill="#FFFFFF"/>
      <circle cx="50"  cy="10" r="2" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="80"  cy="10" r="2" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="110" cy="10" r="2" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="140" cy="10" r="2" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="170" cy="10" r="2" fill="#FFFFFF" opacity="0.5"/>
    </g>
  </g>

  <!-- Floating notification card (top-left) -->
  <g transform="translate(40 110)">
    <rect width="220" height="74" rx="16" fill="#FFFFFF" stroke="#D6DAE3"/>
    <rect x="12" y="14" width="46" height="46" rx="12" fill="#2A52FF"/>
    <path d="M22 36 L30 44 L46 28" fill="none" stroke="#FFFFFF" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="30" font-family="Inter, system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#11151F">Build deployed</text>
    <text x="68" y="46" font-family="Inter, system-ui, sans-serif"
          font-size="10" fill="#4A5063">Puzzle Pop · v 2.4.1</text>
    <text x="68" y="60" font-family="Inter, system-ui, sans-serif"
          font-size="9" fill="#6E7488">Just now</text>
  </g>

  <!-- Floating tag (bottom-right) -->
  <g transform="translate(540 380)">
    <rect width="220" height="68" rx="34" fill="#0A0D14"/>
    <circle cx="34" cy="34" r="18" fill="url(#mbl-accent)"/>
    <path d="M26 34 L32 40 L42 28" fill="none" stroke="#FFFFFF" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="30" font-family="Inter, system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#FFFFFF">All systems healthy</text>
    <text x="62" y="46" font-family="Inter, system-ui, sans-serif"
          font-size="10" fill="#A6ADBE">No incidents · last 30 days</text>
  </g>

  <!-- Rabbit mascot bottom-left -->
  <g transform="translate(40 380)">
    <use href="#mbl-rabbit" x="0" y="0" width="200" height="200"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFD86B">
    <path d="M730 280 L733 286 L739 289 L733 292 L730 298 L727 292 L721 289 L727 286 Z"/>
  </g>
</svg>
