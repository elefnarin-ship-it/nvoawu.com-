<?xml version="1.0" encoding="UTF-8"?>
<!--
  iOS-style store badge — non-trademarked rendition.
  Uses a generic "iOS Store" label and a stylised apple silhouette
  made from simple shapes to stay clear of brand guidelines.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img"
     aria-label="Download on the iOS Store">
  <title>Download on the iOS Store</title>
  <rect x="0" y="0" width="200" height="60" rx="10"
        fill="#0A0D14" stroke="#2A2F3D" stroke-width="1.2"/>
  <!-- Stylised apple-mark: leaf + body, abstract — NOT the Apple logo. -->
  <g transform="translate(20 12)">
    <!-- Leaf -->
    <path d="M16 6 C20 0 26 0 28 4 C24 6 20 8 16 10 Z" fill="#6BE3B7"/>
    <!-- Body — a soft abstract teardrop -->
    <path d="M22 8
             C14 8 8 14 8 22
             C8 30 14 36 22 36
             C26 36 28 34 32 34
             C36 34 38 36 42 36
             C50 36 56 30 56 22
             C56 14 50 8 42 8
             C38 8 36 10 32 10
             C28 10 26 8 22 8 Z"
          fill="#FFFFFF"/>
    <!-- Bite detail -->
    <circle cx="48" cy="14" r="3" fill="#0A0D14"/>
  </g>
  <g font-family="'Inter','Space Grotesk',system-ui,sans-serif" fill="#FFFFFF">
    <text x="92" y="24" font-size="9" font-weight="500" fill="#A6ADBE" letter-spacing="0.6">DOWNLOAD ON</text>
    <text x="92" y="44" font-size="17" font-weight="700">iOS Store</text>
  </g>
</svg>
