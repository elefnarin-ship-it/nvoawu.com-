<?xml version="1.0" encoding="UTF-8"?>
<!--
  N VoaWu — primary logo (single-color, currentColor).
  Reusable <symbol id="logo-mark"> is included so the mark can be
  referenced anywhere via <use href=".../logo.svg#logo-mark" />.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 96"
     role="img"
     aria-label="N VoaWu"
     fill="currentColor"
     font-family="'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif">

  <title>N VoaWu</title>
  <desc>Wordmark and geometric N-chevron mark for the N VoaWu studio.</desc>

  <!-- Reusable mark. ViewBox 0 0 96 96 so it can stand alone or be
       used as a favicon source via #logo-mark. -->
  <symbol id="logo-mark" viewBox="0 0 96 96" overflow="visible">
    <!-- Plate (very subtle backdrop) -->
    <rect x="2" y="2" width="92" height="92" rx="22"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linejoin="round" opacity="0.18"/>
    <!-- The N — three sharp strokes + forward chevron -->
    <g stroke="currentColor" stroke-width="9" stroke-linecap="square"
       stroke-linejoin="miter" fill="none">
      <line x1="26" y1="20" x2="26" y2="76"/>
      <line x1="26" y1="20" x2="70" y2="76"/>
      <line x1="70" y1="20" x2="70" y2="56"/>
    </g>
    <!-- Forward chevron extending past the right vertical -->
    <g stroke="currentColor" stroke-width="9" stroke-linecap="square"
       stroke-linejoin="miter" fill="none">
      <polyline points="58,46 78,46 78,66"/>
    </g>
    <!-- Tiny orbit dot for "global" touch -->
    <circle cx="78" cy="32" r="3.2" fill="currentColor"/>
  </symbol>

  <!-- Visible composition: mark + wordmark -->
  <g>
    <use href="#logo-mark" x="0" y="0" width="80" height="80"
         transform="translate(8 8)"/>
    <!-- Wordmark -->
    <g transform="translate(104 0)">
      <text x="0" y="46"
            font-size="36"
            font-weight="700"
            letter-spacing="-0.5"
            fill="currentColor">N VoaWu</text>
      <text x="2" y="68"
            font-size="10"
            font-weight="500"
            letter-spacing="3.2"
            fill="currentColor"
            opacity="0.62">STUDIO · DIGITAL · APPS</text>
    </g>
  </g>
</svg>
